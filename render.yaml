# Render Blueprint for Clozy (Bagisto) — FREE TIER setup.
#
# Render's Free plan has no persistent disks, so this deliberately does NOT
# self-host MySQL or use a Render disk for uploads — both would lose all
# data on every restart/redeploy. Instead:
#   - MySQL: an external free/cheap host you provision separately (see chat
#     for options). Fill in DB_* below with its connection details.
#   - File storage: Cloudflare R2 (S3-compatible, free tier) via Laravel's
#     S3 filesystem driver. Fill in the AWS_*/R2 values below.
#
# Only one service (clozy-web) is defined — no worker or cron job. Free
# background workers/cron on Render aren't a good fit for a low-traffic
# free deployment, so mail is sent synchronously (QUEUE_CONNECTION=sync)
# and Laravel's scheduler is skipped for now. Revisit both once this is
# running on a paid plan.
#
# NOTE: Render's Blueprint schema does evolve — if the dashboard flags a
# field here as invalid, check https://render.com/docs/blueprint-spec for
# the current key name.

databases: []

services:
  # ---------------------------------------------------------------------
  # Web — the storefront + admin panel (Nginx + PHP-FPM in one container)
  # ---------------------------------------------------------------------
  - type: web
    name: clozy-web
    env: docker
    dockerfilePath: docker/render/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    # First deploy: runs the full unattended installer (migrates, seeds
    # base config, creates the default admin user). Every deploy after
    # that: the installer is skipped (an admin already exists) and this
    # just runs a safe `migrate --force` instead. See
    # app/Console/Commands/EnsureInstalled.php.
    preDeployCommand: php artisan bagisto:ensure-installed
    envVars:
      - key: APP_NAME
        value: Clozy
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false # set to your Render URL / custom domain after first deploy
      - key: APP_ADMIN_URL
        value: admin
      - key: APP_TIMEZONE
        value: UTC
      - key: APP_LOCALE
        value: en
      - key: APP_CURRENCY
        value: USD

      # --- Database: external host, not Render (see note above) ---
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false

      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: CACHE_STORE
        value: file

      # --- File storage: Cloudflare R2 (S3-compatible) ---
      - key: FILESYSTEM_DISK
        value: s3
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: auto
      - key: AWS_BUCKET
        sync: false
      - key: AWS_ENDPOINT
        sync: false
      - key: AWS_URL
        sync: false
      - key: AWS_USE_PATH_STYLE_ENDPOINT
        value: false

      # --- Mail — fill in with real SMTP credentials before going live ---
      - key: MAIL_MAILER
        value: bagisto-dynamic-smtp
      - key: MAIL_FROM_ADDRESS
        sync: false
      - key: MAIL_FROM_NAME
        value: Clozy
